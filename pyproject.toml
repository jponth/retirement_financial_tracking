[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retirement-financial-tracking"
version = "0.1.0"
description = "Foundational technical modules for a retirement financial tracking and action system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fpdf2>=2.8",
  "gradio>=5.0",
  "openpyxl>=3.1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
retirement_financial_tracking = [
  "config/tax_tables_data/*.json",
  "config/recommended_actions_data/*.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
